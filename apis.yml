name: J&T Express
description: 'J&T Express (J&T Global Express Ltd, HKEX: 1519) is a global logistics service operator
  whose core business is express parcel delivery and international logistics. Founded in Indonesia in 2015,
  it operates express delivery networks across 13 countries including Indonesia, Vietnam, Malaysia, the
  Philippines, Thailand, Cambodia, Singapore, China, Saudi Arabia, the UAE, Mexico, Brazil, and Egypt, with
  international freight services reaching Asia, Europe, Africa, the Americas, and Oceania. The company serves
  e-commerce sellers and consumers with parcel pickup, sorting, line-haul, last-mile delivery, and track-and-trace.
  As of this profile J&T Express publishes a public track-and-trace web experience and regional merchant
  onboarding, but no public developer portal, API documentation, or OpenAPI definition was found during
  enrichment; this profile captures the company identity and probed domain security.'
